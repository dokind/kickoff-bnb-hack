# Cypher Run hosting. Everything here belongs to the compose project "pacepact" (the name the server
# was first set up under; renaming the project would leave the data volume behind) and lives in
# /opt/pacepact. It binds no host ports and joins no other project's network.
#
# The quick tunnel's host changes whenever the tunnel restarts. The verifier reads the current host
# from the tunnel's metrics server (http://tunnel:20241/quicktunnel) and writes it to the
# OriginRegistry on BSC testnet when it changes; the apps read it from there. The web app itself
# is served from GitHub Pages.
name: pacepact

services:
  verifier:
    build: ./verifier
    image: pacepact-verifier:latest
    env_file: ./verifier.env
    environment:
      # Overrides verifier.env. The verifier announces its host here (sent from the attester key).
      ORIGIN_REGISTRY: "0xb9aD45Dc177C801f10670F2aac03B467f1C367d2"
      ORIGIN_SOURCE_URL: http://tunnel:20241/quicktunnel
    volumes:
      - data:/data
    networks: [inner, egress]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    networks: [inner]
    depends_on: [verifier]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    # --metrics on all interfaces of this container, so the verifier can ask /quicktunnel for the
    # current host. No port is published: only containers on the same networks reach it.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://caddy:80
    networks: [inner, egress]
    depends_on: [caddy]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

networks:
  # No route to the internet or the host: the static server is reachable only by the tunnel.
  inner:
    internal: true
  # Outbound only (BSC testnet RPC for the verifier, Cloudflare for the tunnel).
  egress: {}

volumes:
  data: {}
