<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base path the site is served from. `flutter build web --base-href
    /kickoff-bnb-hack/` fills it for GitHub Pages; it must start and end with
    a slash. Routes are in the hash (#/r/<launcher>), so the server only ever
    serves this one page.
  -->
  <base href="/kickoff-bnb-hack/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cypher Run: pay a deposit in test USD, check in each day you move, and split the prize. BNB Smart Chain testnet.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cypher Run">
  <meta name="theme-color" content="#0A0E11">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cypher Run</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The splash: drawn by the browser at once, so a scanned link never shows a
    black screen while the app loads. Colours are the app's own (lib/theme/
    tokens.dart): ink #0A0E11, inkDeep #05080A, slate #17222A, volt #D4FF3A.
    It is removed on the app's first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #05080A; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 0 24px;
      background: radial-gradient(120% 80% at 50% 20%, #17222A 0%, #0A0E11 55%, #05080A 100%);
      color: #FFFFFF; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 240ms ease-out;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    #splash p { margin: 0; font-size: 16px; line-height: 1.4; color: rgba(255, 255, 255, 0.64); }
    /*
      The loader is the app's RunLoader (lib/widgets/run_loader.dart) in CSS:
      the two slanted bars of the mark surge forward in a staggered 1.1 s
      stride, each with a fainter copy trailing it, over a treadmill line
      whose dashes stream backwards.
    */
    #splash .runner { position: relative; width: 60px; height: 40px; margin-top: 20px; }
    #splash .bar {
      position: absolute; left: 11px; width: 38px; height: 31px; background: #D4FF3A;
      animation: splash-stride 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    #splash .bar.top { top: 0; clip-path: polygon(30% 0, 100% 0, 88% 40%, 18% 40%); }
    #splash .bar.low { top: 0; clip-path: polygon(12% 58%, 70% 58%, 58% 100%, 0 100%);
      animation-delay: -0.92s; }
    #splash .bar.ghost { opacity: 0.28; animation-name: splash-trail; }
    @keyframes splash-stride {
      0%, 100% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
    }
    @keyframes splash-trail {
      0%, 100% { transform: translateX(-7px); opacity: 0; }
      30% { transform: translateX(-4px); opacity: 0.32; }
      50% { transform: translateX(5px); opacity: 0; }
    }
    #splash .belt {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 1px;
      background-color: rgba(212, 255, 58, 0.16);
      background-image: repeating-linear-gradient(90deg, #D4FF3A 0 10px, transparent 10px 18px);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
      animation: splash-belt 0.55s linear infinite;
    }
    @keyframes splash-belt { from { background-position: 0 0; } to { background-position: -18px 0; } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar, #splash .belt { animation: none; }
      #splash .bar.ghost { display: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <h1>Cypher Run</h1>
    <p>Pay in. Show up each day. Split the prize.</p>
    <div class="runner" role="progressbar" aria-label="Loading">
      <span class="bar top ghost"></span><span class="bar low ghost"></span>
      <span class="bar top"></span><span class="bar low"></span>
      <span class="belt"></span>
    </div>
  </div>
  <script>
    // Flutter's engine replaces the viewport tag with one that turns pinch
    // zoom off (maximum-scale=1.0, user-scalable=no). Put zoom back whenever
    // it does, so people who need to enlarge the page can.
    (function () {
      var open = 'width=device-width, initial-scale=1';
      function allowZoom() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.getAttribute('content') !== open) m.setAttribute('content', open);
        });
      }
      new MutationObserver(allowZoom).observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content']
      });
    })();
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 300);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
